# nginx site for Knowledge Lab. setup.sh replaces __HOST__ with the domain (or IP) and
# installs it as /etc/nginx/sites-available/knowledge-lab. certbot later adds the HTTPS part.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    client_max_body_size 2m;
    server_tokens off;

    location /static/ {
        alias /srv/knowledge-lab/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
