{% extends "base.html" %}
{% block title %}Нэвтрэх · Knowledge Lab{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Нэвтрэх</h1>
  {% if form.errors %}<p class="notice error">Нэвтрэх нэр эсвэл нууц үг буруу байна.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Нэвтрэх нэр <input name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}"></label>
    <label>Нууц үг <input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Нэвтрэх</button>
  </form>
</section>
{% endblock %}
